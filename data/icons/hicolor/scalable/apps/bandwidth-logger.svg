<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Bandwidth Logger</title>
  <defs>
    <linearGradient id="dial" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1a5fb4"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#dial)"/>

  <!-- Gauge arc: the speed test -->
  <path d="M 34 84 A 30 30 0 1 1 94 84"
        fill="none" stroke="#ffffff" stroke-opacity="0.32"
        stroke-width="10" stroke-linecap="round"/>
  <path d="M 34 84 A 30 30 0 0 1 47 59"
        fill="none" stroke="#ffffff"
        stroke-width="10" stroke-linecap="round"/>

  <!-- Needle -->
  <path d="M 64 84 L 82 62" fill="none" stroke="#ffffff"
        stroke-width="7" stroke-linecap="round"/>
  <circle cx="64" cy="84" r="7" fill="#ffffff"/>

  <!-- Recorded history: three log entries -->
  <g fill="#ffffff" fill-opacity="0.9">
    <rect x="40" y="96" width="48" height="5" rx="2.5"/>
    <rect x="40" y="105" width="36" height="5" rx="2.5"/>
  </g>
</svg>
